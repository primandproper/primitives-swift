---
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.swift'
      - Package.swift
      - .swift-format
      - .github/workflows/lint.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

name: lint
jobs:
  swift-format:
    timeout-minutes: 15
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # NOTE: `make lint` runs `swift format lint --strict` against the pinned
      # `.swift-format` config. The existing tree carries pre-existing formatting
      # debt (a `make format` sweep is tracked separately under REPO-03), so this
      # job is reported but non-blocking until that sweep lands. Flip
      # `continue-on-error` to `false` (or delete it) once the tree is clean.
      - name: Lint (swift-format)
        continue-on-error: true
        run: make lint
