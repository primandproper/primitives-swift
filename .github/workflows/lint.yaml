---
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.swift'
      - Package.swift
      - .swift-format
      - .github/workflows/lint.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

name: lint
jobs:
  swift-format:
    timeout-minutes: 15
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # `make lint` runs `swift format lint --strict` against the pinned
      # `.swift-format` config. The tree was swept clean under REPO-03, so this
      # job is blocking: any new formatting drift fails CI. Run `make format`
      # locally to fix.
      - name: Lint (swift-format)
        run: make lint
